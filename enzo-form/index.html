<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب Enzo الآن – الدفع عند الاستلام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f2430;
    --muted: #5d6475;
    --line: #d6d0dc;
    --accent: #5b2a6e;
    --accent-ink: #ffffff;
    --ok: #1e7a4c;
    --err: #b3261e;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 700; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 1rem; }
  label { display: block; margin: 14px 0 6px; font-weight: 500; }
  input, select {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    font: inherit;
    font-size: 16px; /* يمنع التكبير التلقائي في iPhone */
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 3px solid rgba(91, 42, 110, .35);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[type="tel"] { direction: ltr; text-align: right; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
  button {
    width: 100%;
    height: 56px;
    margin-top: 22px;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: .65; cursor: not-allowed; }
  .note { margin: 12px 0 0; color: var(--muted); font-size: .9rem; text-align: center; }
  #msg { min-height: 1.5em; margin: 14px 0 0; color: var(--err); font-weight: 500; }
  .success {
    display: none;
    padding: 24px 18px;
    border: 2px solid var(--ok);
    border-radius: 12px;
    text-align: center;
  }
  .success h2 { margin: 0 0 8px; color: var(--ok); font-size: 1.35rem; }
  .success p { margin: 0; }
  /* honeypot: مخفي عن الزبون، البوتات تعمّره */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main class="wrap">
  <h1>اطلب Enzo الآن</h1>
  <p class="sub">الدفع عند الاستلام. عمّر المعلومات وسنتصل بك لتأكيد الطلب.</p>

  <form id="orderForm" novalidate autocomplete="on">
    <label for="name">الاسم الكامل</label>
    <input id="name" name="name" type="text" autocomplete="name" maxlength="60" required>

    <label for="phone">رقم الهاتف</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="05 XX XX XX XX" required>

    <label for="wilaya">الولاية</label>
    <select id="wilaya" name="wilaya" required>
      <option value="">اختر الولاية</option>
    </select>

    <label for="commune">البلدية</label>
    <input id="commune" name="commune" type="text" autocomplete="address-level2" maxlength="60" required>

    <label for="quantity">الكمية</label>
    <select id="quantity" name="quantity">
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <!-- honeypot -->
    <div class="hp" aria-hidden="true">
      <label for="website">لا تعمّر هذا الحقل</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <p id="msg" role="alert" aria-live="polite"></p>
    <button id="submitBtn" type="submit">اطلب الآن</button>
    <p class="note">لا يتم أي دفع الآن. تدفع عند استلام الطلب.</p>
  </form>

  <section id="success" class="success" role="status">
    <h2>تم استلام طلبك ✅</h2>
    <p>سنتصل بك قريبا على رقمك لتأكيد الطلب. شكرا لثقتك.</p>
  </section>
</main>

<script>
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbxovvCA1CAeUpUnlsLpJtQI5K_LqMliz-7Bc_X5u9PzOQlUWzPlQwKlRUdxA3ATjuLU/exec";
  const PRODUCT = "Enzo";

  const WILAYAS = [
    "أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة",
    "تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة",
    "سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة",
    "وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة",
    "سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان","تيميمون",
    "برج باجي مختار","أولاد جلال","بني عباس","عين صالح","عين قزام","تقرت","جانت","المغير","المنيعة"
  ];

  const form = document.getElementById("orderForm");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");
  const success = document.getElementById("success");
  const wilayaSel = document.getElementById("wilaya");

  WILAYAS.forEach((w, i) => {
    const label = String(i + 1).padStart(2, "0") + " - " + w;
    const o = document.createElement("option");
    o.value = label;
    o.textContent = label;
    wilayaSel.appendChild(o);
  });

  // يحول الأرقام العربية ٠١٢٣ إلى لاتينية
  const toLatin = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const normPhone = s => toLatin(s).replace(/[\s\-.]/g, "").replace(/^\+213/, "0").replace(/^00213/, "0");

  let sending = false;

  function fail(text, el) {
    msg.textContent = text;
    if (el) el.focus();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (sending) return;           // منع الضغط المتكرر
    msg.textContent = "";

    const f = form.elements;
    const name = f.name.value.trim();
    const phone = normPhone(f.phone.value);
    const wilaya = f.wilaya.value;
    const commune = f.commune.value.trim();
    const quantity = f.quantity.value;

    if (name.length < 3) return fail("اكتب اسمك الكامل (3 أحرف على الأقل).", f.name);
    if (!/^0[567]\d{8}$/.test(phone)) return fail("رقم الهاتف غير صحيح. مثال: 0555123456", f.phone);
    if (!wilaya) return fail("اختر الولاية.", f.wilaya);
    if (commune.length < 2) return fail("اكتب اسم البلدية.", f.commune);

    // honeypot مملوء = بوت: نتظاهر بالنجاح بلا إرسال
    if (f.website.value) { showSuccess(); return; }

    sending = true;
    btn.disabled = true;
    btn.textContent = "جاري الإرسال…";

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);

    try {
      const res = await fetch(EXEC_URL, {
        method: "POST",
        body: new URLSearchParams({
          name, phone, wilaya, commune, quantity,
          product: PRODUCT,
          website: ""
        }),
        signal: ctrl.signal
      });
      const data = await res.json();
      if (data && data.ok) {
        showSuccess();
        return;
      }
      if (data && data.error === "phone") fail("رقم الهاتف غير صحيح.", f.phone);
      else fail("صرا خطأ، تأكد من المعلومات وحاول مرة أخرى.");
    } catch (err) {
      fail("تعذر الإرسال. تأكد من الإنترنت وحاول مرة أخرى.");
    } finally {
      clearTimeout(timer);
      if (!success.style.display || success.style.display === "none") {
        sending = false;
        btn.disabled = false;
        btn.textContent = "اطلب الآن";
      }
    }
  });

  function showSuccess() {
    form.style.display = "none";
    success.style.display = "block";
    success.scrollIntoView({ behavior: "smooth", block: "center" });
  }
</script>
</body>
</html>
